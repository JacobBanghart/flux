# Headscale: self-hosted Tailscale control server (coordination only; no
# traffic flows through it). Peers connect to each other directly, or via
# Tailscale's public DERP relays when NAT gets in the way.
#
# Config, policy and the Authentik login are in config.yaml and
# policy.hujson next to this file (see kustomization.yaml).
#
# Devices join either through Authentik in the browser (phones, laptops):
#   tailscale up --login-server https://headscale.jacobbanghart.com
# or, for headless boxes, with a pre-auth key minted in the pod:
#   kubectl -n headscale exec deploy/headscale -- headscale preauthkeys create --user <id> --expiration 1h [--tags tag:server]
#   tailscale up --login-server https://headscale.jacobbanghart.com --authkey <key>
#
# The subnet router + exit node is tsrouter (Proxmox CT 202,
# k8s-homelab/terraform/lxc-tsrouter.tf), not anything in this cluster.
#
# If this pod is down, already-connected devices keep working. Only new
# logins and changes stop.
apiVersion: v1
kind: Namespace
metadata:
  name: headscale
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headscale-data
  namespace: headscale
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-oidc
  namespace: headscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: headscale-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: headscale/oidc
        property: client_secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: headscale
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # SQLite on an RWO local-path PVC: never run two pods against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headscale
          image: docker.io/headscale/headscale:v0.29.7@sha256:11f81665e842809db9fe3006a38c56a66e968baa5abd4bac498e86445572b970
          args:
            - serve
            - --config
            - /etc/headscale/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          volumeMounts:
            # subPath keeps the default path the in-pod `headscale` CLI reads.
            # subPath files don't live-update; fine, since a config change
            # renames the generated ConfigMap and rolls the pod anyway.
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: policy
              mountPath: /etc/headscale/policy
              readOnly: true
            - name: oidc
              mountPath: /etc/headscale/oidc
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
            - name: run
              mountPath: /var/run/headscale
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: policy
          configMap:
            name: headscale-policy
        - name: oidc
          secret:
            secretName: headscale-oidc
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: headscale
spec:
  selector:
    app: headscale
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headscale
  namespace: headscale
  annotations:
    # See mealie.yaml: an IngressRoute has no LoadBalancer status, so
    # external-dns needs an explicit target or it creates no record at all.
    # Must stay DNS-only (unproxied) in Cloudflare: its proxy breaks the
    # Tailscale control protocol upgrade on /ts2021.
    external-dns.alpha.kubernetes.io/target: "68.170.78.3"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`headscale.jacobbanghart.com`)
      kind: Rule
      services:
        - name: headscale
          port: 8080
  tls:
    secretName: headscale-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headscale-tls
  namespace: headscale
spec:
  secretName: headscale-tls
  duration: 2160h # 90d
  # Staggered against the rest of the estate (see mealie.yaml).
  renewBefore: 672h # 28d
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - headscale.jacobbanghart.com
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
