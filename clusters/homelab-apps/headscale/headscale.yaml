# Headscale: self-hosted Tailscale control server (coordination only; no
# traffic flows through it). Peers connect to each other directly, or via
# Tailscale's public DERP relays when NAT gets in the way.
#
# Devices join with pre-auth keys minted in the pod:
#   kubectl -n headscale exec deploy/headscale -- headscale users create jacob
#   kubectl -n headscale exec deploy/headscale -- headscale preauthkeys create --user <id> --expiration 1h
#   tailscale up --login-server https://headscale.jacobbanghart.com --authkey <key>
# Authentik (OIDC) login can be added later; it needs an Authentik provider and
# a Vault entry, like mealie/oidc.
#
# No ACL policy yet, so every node can reach every other node. Fine while
# every node is the owner's; add one before anyone else joins.
#
# If this pod is down, already-connected devices keep working. Only new
# logins and changes stop.
apiVersion: v1
kind: Namespace
metadata:
  name: headscale
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headscale-data
  namespace: headscale
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: headscale
data:
  config.yaml: |
    server_url: https://headscale.jacobbanghart.com
    listen_addr: 0.0.0.0:8080
    # In-cluster only: the namespace's NetworkPolicy admits Traefik and
    # monitoring, and only 8080 is routed by Traefik.
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 127.0.0.1:50443
    grpc_allow_insecure: false
    noise:
      private_key_path: /var/lib/headscale/noise_private.key
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
      allocation: sequential
    derp:
      server:
        # The embedded relay needs UDP 3478 forwarded through the UDM; not
        # worth it until Tailscale's public relays become a problem.
        enabled: false
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      paths: []
      auto_update_enabled: true
      update_frequency: 3h
    disable_check_updates: true
    node:
      expiry: 0
      ephemeral:
        inactivity_timeout: 30m
    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite
        write_ahead_log: true
    log:
      level: info
      format: text
    policy:
      mode: file
      path: ""
    dns:
      # MagicDNS names (<host>.ts.jacobbanghart.com) without taking over each
      # device's resolver: LAN names like truenas.home keep working.
      magic_dns: true
      base_domain: ts.jacobbanghart.com
      override_local_dns: false
      nameservers:
        global: []
        split: {}
      search_domains: []
      extra_records: []
    unix_socket: /var/run/headscale/headscale.sock
    unix_socket_permission: "0770"
    logtail:
      enabled: false
    taildrop:
      enabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: headscale
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # SQLite on an RWO local-path PVC: never run two pods against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headscale
          image: docker.io/headscale/headscale:v0.29.7@sha256:11f81665e842809db9fe3006a38c56a66e968baa5abd4bac498e86445572b970
          args:
            - serve
            - --config
            - /etc/headscale/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/headscale
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
            - name: run
              mountPath: /var/run/headscale
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: data
          persistentVolumeClaim:
            claimName: headscale-data
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: headscale
spec:
  selector:
    app: headscale
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headscale
  namespace: headscale
  annotations:
    # See mealie.yaml: an IngressRoute has no LoadBalancer status, so
    # external-dns needs an explicit target or it creates no record at all.
    # Must stay DNS-only (unproxied) in Cloudflare: its proxy breaks the
    # Tailscale control protocol upgrade on /ts2021.
    external-dns.alpha.kubernetes.io/target: "68.170.78.3"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`headscale.jacobbanghart.com`)
      kind: Rule
      services:
        - name: headscale
          port: 8080
  tls:
    secretName: headscale-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headscale-tls
  namespace: headscale
spec:
  secretName: headscale-tls
  duration: 2160h # 90d
  # Staggered against the rest of the estate (see mealie.yaml).
  renewBefore: 672h # 28d
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - headscale.jacobbanghart.com
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
