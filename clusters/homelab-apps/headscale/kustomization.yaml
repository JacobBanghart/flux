apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - headscale.yaml
# Generated with a content hash in the name, so editing config.yaml or
# policy.hujson rolls the Deployment (Headscale only reads both at startup).
configMapGenerator:
  - name: headscale-config
    namespace: headscale
    files:
      - config.yaml
  - name: headscale-policy
    namespace: headscale
    files:
      - policy.hujson
