# LSAT 170 Gradebook -- course gradebook for LSAT study (Next.js + SQLite).
# Source: https://github.com/JacobBanghart/lsat-gradebook (private)
#
# PUBLIC WITH NO LOGIN, by explicit decision (2026-09-27): the student has to
# reach it from outside the home network. Accepted exposure: anyone who finds
# lsat.jacobbanghart.com can view and change grades, and see evidence photos.
# The hostname is already in certificate transparency logs, so it is not
# secret. Declined compensating controls: app passcodes, Authentik
# forward-auth, the earlier lan-only IPAllowList. If this ever needs closing,
# INSTRUCTOR_PASSCODE (app env) gates the /i pages with no code change.
# The app sends noindex so search engines skip it. Only Traefik and monitoring
# can reach the pod (network-policies/app-ingress.yaml).
#
# Single replica + Recreate is required, not a preference: SQLite plus an
# in-process scheduler (deadline close, forfeits) must never run twice.
#
# Data: /data on a local-path PVC holds gradebook.db, the evidence photos, and
# nightly VACUUM INTO snapshots in /data/backups (02:30 PT). The backup
# namespace's 03:00 restic job ships all of /var/lib/local-path offsite, so the
# snapshot taken half an hour earlier is always a consistent copy.
---
apiVersion: v1
kind: Namespace
metadata:
  name: lsat-gradebook
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lsat-gradebook-data
  namespace: lsat-gradebook
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
# Private GHCR image. The token lives in Vault at lsat-gradebook/ghcr
# (keys: username, token -- a GitHub token with the read:packages scope).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: lsat-gradebook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # trim: a token piped from `gh auth token` into `vault kv put token=-` keeps its trailing newline.
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .username | trim }}","password":"{{ .token | trim }}","auth":"{{ printf "%s:%s" (.username | trim) (.token | trim) | b64enc }}"}}}'
  dataFrom:
    - extract:
        key: lsat-gradebook/ghcr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lsat-gradebook
  namespace: lsat-gradebook
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lsat-gradebook
  template:
    metadata:
      labels:
        app: lsat-gradebook
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lsat-gradebook
          # Built by .github/workflows/publish.yml in the app repo. Pinned to a
          # commit tag so a new image is a manifest change Flux can see. Bump
          # this line to deploy.
          image: ghcr.io/jacobbanghart/lsat-gradebook:sha-f59e37578571c9d9841a13932a57dcde7dcc5ef8
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATA_DIR
              value: /data
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              # sharp decodes full-size phone photos in memory on upload.
              memory: "768Mi"
          volumeMounts:
            - name: data
              mountPath: /data
            # Read-only root: multipart uploads spool to /tmp, and Next writes
            # its runtime cache under .next/cache.
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lsat-gradebook-data
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lsat-gradebook
  namespace: lsat-gradebook
spec:
  selector:
    app: lsat-gradebook
  ports:
    - port: 80
      targetPort: 3000
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lsat-gradebook
  namespace: lsat-gradebook
  annotations:
    # An IngressRoute carries no LoadBalancer status, so the traefik source has
    # no address to derive a target from -- and external-dns drops a hostname
    # with zero targets before --default-targets is ever consulted. Without
    # this the app gets no record at all, silently.
    external-dns.alpha.kubernetes.io/target: "68.170.78.3"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`lsat.jacobbanghart.com`)
      kind: Rule
      services:
        - name: lsat-gradebook
          port: 80
  tls:
    secretName: lsat-gradebook-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lsat-gradebook-tls
  namespace: lsat-gradebook
spec:
  secretName: lsat-gradebook-tls
  duration: 2160h # 90d
  # Staggered after the rest of the estate (15d..26d).
  renewBefore: 648h # 27d
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - lsat.jacobbanghart.com
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
