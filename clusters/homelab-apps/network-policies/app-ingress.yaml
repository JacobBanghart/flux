---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-and-monitoring
  namespace: authentik
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Traefik is the only thing that should be able to open a connection
        # into this namespace from outside it.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        # Prometheus scraping. No app here exposes a ServiceMonitor today, but
        # allowing it costs nothing and avoids a silent scrape failure the
        # first time one is added.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        # Same-namespace traffic: app to its own database, cache, sidecars.
        - podSelector: {}
        # The CloudNativePG operator manages authentik-postgres from
        # cnpg-system: it connects to the instances for failover, backups and
        # switchover. Without this the cluster keeps running but the operator
        # loses the ability to act on it.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system

---
# homestead runs a public game server -- see the game-port rule below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-and-monitoring
  namespace: homestead
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Traefik is the only thing that should be able to open a connection
        # into this namespace from outside it.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        # Prometheus scraping. No app here exposes a ServiceMonitor today, but
        # allowing it costs nothing and avoids a silent scrape failure the
        # first time one is added.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        # Same-namespace traffic: app to its own database, cache, sidecars.
        - podSelector: {}
    # Minecraft is published on the MetalLB VIP 10.4.0.202 with a WAN
    # port-forward (UnifiTerraform: WAN:25566). Players connect straight to
    # the VIP, not through Traefik, so restricting this namespace to Traefik
    # would silently drop every player. The game port is deliberately open to
    # the world; everything else in the namespace is not.
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 25565
