# Migrated from dev cluster (Wave 1 of the dev->k8s-homelab migration,
# see docs/decisions.md). No public hostname/ingress involved -- CI
# runners only make outbound connections to GitHub, so none of the
# port-forward/DNS cutover concerns from the other Wave 1 apps apply
# here.
#
# Shared runner for BackToSafety repository
# Docker enabled to support image builds
apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: shared-runner
  namespace: actions-runner-system
spec:
  replicas: 1
  template:
    spec:
      repository: JacobBanghart/BackToSafety
      labels:
        - self-hosted
        - linux
      dockerEnabled: true
      resources:
        limits:
          cpu: "8"
          memory: 8Gi
        requests:
          cpu: "100m"
          memory: 128Mi
      ephemeral: true
      # Same mid-job kill as ferrix-runner below -- see the long comment
      # there. This one also scales down via the HRA, which is an extra
      # source of pod deletions, so the short drain window bites here too
      # (2 orphaned offline registrations on BackToSafety as of 2026-08-16).
      terminationGracePeriodSeconds: 1800
      env:
        - name: RUNNER_GRACEFUL_STOP_TIMEOUT
          value: "1800"
---
apiVersion: actions.summerwind.dev/v1alpha1
kind: HorizontalRunnerAutoscaler
metadata:
  name: shared-runner-autoscaler
  namespace: actions-runner-system
spec:
  scaleTargetRef:
    name: shared-runner
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: TotalNumberOfQueuedAndInProgressWorkflowRuns
      repositoryNames:
        - JacobBanghart/BackToSafety
---
# Runner for ReclaimerGold/Ferrix -- capped at 4 cores / 4Gi per runner.
#
# Fixed warm pool rather than an HRA, on purpose.
#
# An idle runner pod costs ~200Mi of actual memory (runner ~110-170Mi +
# dind ~30-40Mi) and ~4m CPU, and only reserves 128Mi. Ten of them is
# ~2Gi actual against roughly 27Gi free across worker-0 and worker-2, so
# keeping them warm is close to free on this cluster.
#
# Autoscaling can't win here on timing: the CI workflow finishes in
# ~4m50s, while ARC's 1m sync period plus a doubling scale-up factor
# needs ~3m to ramp 2 -> 12. The run is nearly over before the capacity
# lands, so you pay the complexity and still queue. An HRA would earn
# its keep if idle capacity were billed by the hour, which it isn't.
#
# Sized to the workflow: 11 jobs, of which "All checks passed" is a
# near-instant gate and the GHCR push is a skipped matrix, so real
# concurrency peaks around 8-9.
#
# Note this is independent of `ephemeral`. Runners still recycle after
# every job -- a fixed pool size does not mean long-lived runners.
apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: ferrix-runner
  namespace: actions-runner-system
spec:
  replicas: 10
  template:
    spec:
      repository: ReclaimerGold/rdn-pve-manager
      labels:
        - self-hosted
        - linux
      dockerEnabled: true
      # These runners are ephemeral (no `ephemeral:` field -> ARC defaults
      # to true), so ARC recycles a pod after each job. Deletion fires the
      # runner image's preStop hook, which is meant to drain in-flight work:
      #   while [ -f /runner/.runner ]; do sleep 1; done
      # but it's wrapped in `timeout ${RUNNER_GRACEFUL_STOP_TIMEOUT:-15}`.
      # Unset, that's 15s -- far shorter than a job -- so the hook exits
      # non-zero (FailedPreStopHook) and kubelet kills the pod mid-job. The
      # job then hangs in_progress on GitHub with no runner to report back
      # and eventually resolves as cancelled, and the runner never
      # deregisters, leaving an orphaned "offline" registration behind
      # (8 of them had accumulated by 2026-08-16).
      #
      # Both values are required: raising only the hook timeout still gets
      # SIGKILLed at the default 30s grace period.
      terminationGracePeriodSeconds: 1800
      env:
        - name: RUNNER_GRACEFUL_STOP_TIMEOUT
          value: "1800"
      # Without this every runner pod piles onto one node (all 4 sat on
      # k8s-worker-0 on 2026-08-16). Two causes stack up:
      #
      #   1. ARC gives each runner pod its own Runner CR as ownerRef,
      #      rather than one shared ReplicaSet. The scheduler's default
      #      spreading keys off shared Service/ReplicaSet/StatefulSet
      #      ownership, so it sees N unrelated pods and has no signal to
      #      spread them at all.
      #   2. With no spreading signal, NodeResourcesFit's LeastAllocated
      #      scoring decides, and it always picks the emptiest node.
      #      k8s-worker-0 sits at ~33% memory requests vs ~84% on
      #      worker-1 and ~51% on worker-2, so it wins every time.
      #
      # ScheduleAnyway rather than DoNotSchedule on purpose: a runner
      # that can't schedule means queued CI jobs, and a hard constraint
      # is exactly what stalled the grafana rollout for 5 days when a
      # node was unavailable. Soft is enough here because the topology
      # spread plugin carries more scoring weight than resource fit.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              runner-deployment-name: ferrix-runner
      # CephFS-backed RWX volumes provision with root:root 0755 at the
      # mount root; the runner container runs as uid=1001(runner), so
      # without fsGroup it can't mkdir anything under a fresh volume --
      # broke every job hitting actions/setup-node with EACCES on
      # /opt/hostedtoolcache/node (2026-07-20).
      #
      # fsGroupChangePolicy defaults to "Always", which makes kubelet
      # recursively chown the whole volume tree on every single pod
      # mount. With 4 replicas sharing the same RWX volume, concurrent
      # recursive walks raced each other and hit
      # "lstat ... no such file or directory" FailedMount errors once
      # the volume had real content in it. OnRootMismatch skips the walk
      # once the root dir's group already matches, which it does after
      # the first fix -- no more redundant/racy chowns on remount.
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      resources:
        limits:
          cpu: "4"
          memory: 4Gi
        requests:
          cpu: "100m"
          memory: 128Mi
      githubAPICredentialsFrom:
        secretRef:
          name: ferrix-runner-secret
      # Dev's version of this used per-node hostPath caches (single-node
      # cluster, always the same disk). k8s-homelab has 3 workers and an
      # ephemeral runner pod can land on any of them, so hostPath would
      # give inconsistent cache hits -- switched to a shared
      # ceph-filesystem (RWX) PVC instead so the cache is consistent
      # regardless of which worker schedules the pod.
      volumeMounts:
        - name: tool-cache
          mountPath: /opt/hostedtoolcache
        - name: npm-cache
          mountPath: /cache/npm
      volumes:
        - name: tool-cache
          persistentVolumeClaim:
            claimName: ferrix-tool-cache
        - name: npm-cache
          persistentVolumeClaim:
            claimName: ferrix-npm-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ferrix-tool-cache
  namespace: actions-runner-system
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ceph-filesystem
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ferrix-npm-cache
  namespace: actions-runner-system
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ceph-filesystem
  resources:
    requests:
      storage: 5Gi
