# Label Designer -- browser canvas editor for thermal printer labels.
# Source: https://github.com/JacobBanghart/label-designer
#
# Entirely client-side: no backend, no database, no secrets, no persistence
# beyond the visitor's own browser storage. That is why there is no PVC, no
# ExternalSecret, and no ConfigMap here -- the pod serves static files and
# nothing else.
---
apiVersion: v1
kind: Namespace
metadata:
  name: label-designer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: label-designer
  namespace: label-designer
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: label-designer
  template:
    metadata:
      labels:
        app: label-designer
    spec:
      containers:
        - name: label-designer
          # Built and published by .github/workflows/publish.yml in the app repo.
          image: ghcr.io/jacobbanghart/label-designer:latest
          # Static nginx; modest requests are genuinely enough.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          ports:
            # nginx-unprivileged runs as uid 101 and listens on 8080.
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # nginx writes its temp/pid files
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: label-designer
  namespace: label-designer
spec:
  selector:
    app: label-designer
  ports:
    - port: 80
      targetPort: 8080
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: label-designer
  namespace: label-designer
  # NOT excluded from external-dns, unlike most apps here.
  #
  # The exclusion elsewhere exists to stop external-dns flipping an EXISTING
  # live record away from the old dev Traefik before that cluster is out of the
  # path. This hostname is new: no record exists and there is no old-cluster
  # counterpart, so there is nothing to flip. Excluding it would just mean the
  # app never gets a record at all.
  #
  # external-dns will create labels.jacobbanghart.com -> 10.4.0.200 (the Traefik
  # LoadBalancer VIP), the same as auth.jacobbanghart.com. That is a private
  # address in public DNS, which is the established pattern here: it resolves
  # for LAN clients and is inert from the internet.
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`labels.jacobbanghart.com`)
      kind: Rule
      services:
        - name: label-designer
          port: 80
  tls:
    secretName: label-designer-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: label-designer-tls
  namespace: label-designer
spec:
  secretName: label-designer-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - labels.jacobbanghart.com
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
